<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121316;
    --surface:#1c2024;
    --surface-2:#23282d;
    --border:#31373d;
    --text:#eef0f2;
    --text-muted:#8b9198;
    --text-faint:#575e64;
    --p1:#ff5c3d;
    --p1-dim:rgba(255,92,61,.14);
    --p2:#43c9dd;
    --p2-dim:rgba(67,201,221,.14);
    --cheat:#ffc84d;
    --off:#ff5c5c;
    --radius:14px;
    /* arcade neon accents */
    --neon-blue:#3ddcff;
    --neon-green:#39ff6a;
    --neon-amber:#ffb020;
    --lava:#ff5c3d;
    /* zen accents (player 3) */
    --zen-lavender:#a899e6;
    --zen-teal:#4ecdc4;
    /* general chrome accent — shifts to zen colors while viewing a mindfulness player */
    --accent-a:var(--p1);
    --accent-b:var(--p2);
  }
  #root.zen-mode{ --accent-a:var(--zen-lavender); --accent-b:var(--zen-teal); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
  .wordmark{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:900;
    font-size:44px;
    letter-spacing:1px;
    line-height:1;
    margin:0;
    background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    transition:background .5s ease;
  }
  .tagline{
    color:var(--text-muted);
    font-size:13px;
    margin:4px 0 28px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.5px;
  }
  button{font-family:inherit;cursor:pointer;}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent-b);outline-offset:2px;}

  /* setup */
  .setup-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .setup-card h2{margin:0 0 6px;font-size:19px;}
  .setup-card p{color:var(--text-muted);font-size:14px;margin:0 0 22px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
  .field input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:10px;padding:12px 14px;font-size:15px;
  }
  .primary-btn{
    background:var(--accent-a);color:#14171a;border:none;border-radius:10px;
    padding:13px 20px;font-size:15px;font-weight:700;width:100%;margin-top:6px;
    transition:transform .1s ease, opacity .15s ease, background .4s ease;
  }
  .primary-btn:active{transform:scale(.98);}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* VS player toggle */
  .vs-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px;}
  .player-card{
    flex:1 1 74px;min-width:74px;position:relative;padding:12px 8px 10px;border-radius:12px;border:2px solid var(--border);
    background:var(--surface);text-align:center;overflow:hidden;cursor:pointer;
    transition:border-color .25s ease, box-shadow .25s ease, transform .12s ease;
  }
  .player-card:active{transform:scale(.97);}
  .player-badge{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;
    height:12px;margin-bottom:3px;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .player-name{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:16px;color:var(--text-muted);
    transition:color .25s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .player-card.active .player-name{color:var(--text);}
  .player-card.active{
    border-color:var(--pc);
    box-shadow:0 0 14px var(--pc-dim), inset 0 0 18px var(--pc-dim2);
    animation:player-pulse 1.8s ease-in-out infinite;
  }
  @keyframes player-pulse{0%,100%{background:var(--surface);}50%{background:var(--pc-bg);}}
  .player-card.active .player-badge{color:var(--pc);}
  .player-card.active .player-badge::before{content:attr(data-badge);}
  .player-card.flash::after{
    content:'';position:absolute;inset:0;background:#fff;opacity:.55;
    animation:player-flash .3s ease-out forwards;
  }
  @keyframes player-flash{0%{opacity:.55;}100%{opacity:0;}}
  .add-player-btn{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:1.5px dashed var(--border);background:none;color:var(--text-faint);
    font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease,color .15s ease,transform .12s ease;
  }
  .add-player-btn:active{transform:scale(.92);}
  .aura-fade{
    position:fixed;inset:0;z-index:55;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(168,153,230,.2), rgba(78,205,196,.12) 55%, transparent 80%);
    opacity:0;animation:aura-fade-anim 1.1s ease-out forwards;
  }
  @keyframes aura-fade-anim{
    0%{opacity:0;} 25%{opacity:1;} 100%{opacity:0;}
  }

  /* view tabs (Today / Leaderboard) */
  .view-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .view-tab{
    flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted);font-size:13px;font-weight:600;
    text-align:center;transition:.15s ease;
  }
  .view-tab.active{background:var(--accent-a);color:#14171a;border-color:var(--accent-a);}

  /* component picker (add player / add component) */
  .comp-picker{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .comp-check{
    display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;
  }
  .comp-check input{width:18px;height:18px;accent-color:var(--accent-a);flex-shrink:0;}
  .ghost-btn{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:10px;
    padding:13px 20px;font-size:14px;font-weight:600;width:100%;margin-top:8px;
  }
  .add-component-btn{
    width:100%;background:none;border:1px dashed var(--border);color:var(--text-faint);
    border-radius:10px;padding:10px;font-size:13px;margin:4px 0 16px;
  }

  /* today card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .card-head h3{margin:0;font-size:16px;}
  .date-nav{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);}
  .date-nav button{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;width:24px;height:24px;font-size:13px;line-height:1;}
  .date-nav button:disabled{opacity:.25;cursor:not-allowed;}

  .row-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}

  /* workout: kettlebell gravity drop */
  .kb-rig{
    position:relative;height:180px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;margin-bottom:6px;overflow:hidden;
  }
  .kb-track{position:absolute;left:50%;top:0;bottom:38px;width:2px;transform:translateX(-50%);
    background:repeating-linear-gradient(var(--border) 0 6px, transparent 6px 12px);opacity:.5;}
  .kb-floor{
    position:absolute;left:12px;right:12px;bottom:12px;height:26px;border-radius:8px;
    background:var(--surface);border:1px solid var(--border);
  }
  .kb-bell{
    position:absolute;left:50%;top:16px;width:48px;margin-left:-24px;
    touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;-webkit-tap-highlight-color:transparent;
  }
  .kb-bell.dragging{cursor:grabbing;}
  .kb-bell.returning{transition:top .5s cubic-bezier(.22,1.5,.4,1);}
  .kb-bell.launching{transition:top .32s cubic-bezier(.7,0,.9,.42);pointer-events:none;}
  .kb-bell.hidden{visibility:hidden;}
  .kb-stamp{
    position:absolute;inset:14px;display:none;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;letter-spacing:2.5px;
    color:var(--lava);border:3px solid var(--lava);border-radius:12px;
    background:rgba(255,92,61,.08);cursor:pointer;
    text-shadow:0 0 10px rgba(255,92,61,.8);-webkit-tap-highlight-color:transparent;
  }
  .kb-stamp.show{
    display:flex;
    animation:kb-stamp-pop .35s cubic-bezier(.34,1.56,.64,1), kb-stamp-glow 1.6s ease-in-out infinite .35s;
  }
  @keyframes kb-stamp-pop{
    0%{transform:scale(2) rotate(-14deg);opacity:0;}
    60%{transform:scale(.9) rotate(-10deg);opacity:1;}
    100%{transform:scale(1) rotate(-10deg);opacity:1;}
  }
  @keyframes kb-stamp-glow{
    0%,100%{box-shadow:0 0 16px 2px rgba(255,92,61,.5), inset 0 0 12px rgba(255,92,61,.22);}
    50%{box-shadow:0 0 28px 7px rgba(255,140,70,.7), inset 0 0 18px rgba(255,160,100,.4);}
  }
  .screen-crash{
    position:fixed;left:0;right:0;bottom:0;height:6px;pointer-events:none;z-index:80;
    background:radial-gradient(ellipse at center,rgba(255,150,80,.95),rgba(255,92,61,.55) 45%,transparent 78%);
    opacity:0;animation:screen-crash-flash .5s ease-out forwards;
  }
  @keyframes screen-crash-flash{
    0%{opacity:0;height:4px;}
    12%{opacity:1;height:70px;}
    100%{opacity:0;height:14px;}
  }
  #root.crash-shake{animation:crash-shake .3s ease;}
  @keyframes crash-shake{
    10%,90%{transform:translateY(-1px)} 20%,80%{transform:translateY(2px)}
    30%,50%,70%{transform:translateY(-3px)} 40%,60%{transform:translateY(3px)}
  }
  .kb-shard{
    position:fixed;border-radius:2px;pointer-events:none;z-index:81;
    background:linear-gradient(160deg,#4a5058,#1c2024 75%);border:1px solid rgba(255,255,255,.08);
    box-shadow:0 0 6px 1px rgba(255,120,70,.35);
    animation:kb-shard-fly .55s cubic-bezier(.25,.7,.5,1) forwards;
  }
  @keyframes kb-shard-fly{
    0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1);}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4);}
  }
  .kb-handle{width:24px;height:15px;margin:0 auto;border:5px solid var(--text-muted);border-bottom:none;border-radius:14px 14px 0 0;}
  .kb-ball{
    width:48px;height:42px;margin-top:-2px;border-radius:48% 48% 44% 44%;
    background:linear-gradient(160deg,#3d434a,#1c2024 72%);border:1px solid var(--border);
    box-shadow:inset -6px -6px 10px rgba(0,0,0,.45), inset 4px 4px 6px rgba(255,255,255,.06);
  }
  .lift-status{font-size:12px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;text-align:center;margin-bottom:18px;}

  /* steps: draggable run track */
  .steps-row{margin-bottom:18px;}
  .steps-readout{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .steps-readout span:first-child{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:30px;color:var(--p2);}
  .goal-chip{flex-shrink:0;font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .run-track{
    position:relative;height:54px;border:1px solid var(--border);
    border-radius:27px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    background:linear-gradient(180deg,#2a2420,#241f1c);
    transition:background .4s ease;
  }
  .run-track.tier2{background:repeating-linear-gradient(90deg,#26292d 0 22px,#2c3034 22px 26px);}
  .run-track.tier3{background:linear-gradient(180deg,#1a2530,#152028);box-shadow:inset 0 0 18px rgba(61,220,255,.18);}
  .run-track-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,var(--p2-dim),var(--p2));
  }
  .run-track.tier3 .run-track-fill{background:linear-gradient(90deg,rgba(61,220,255,.15),var(--neon-blue));
    box-shadow:0 0 14px 2px rgba(61,220,255,.55);}
  .run-goal-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text-faint);z-index:2;}
  .run-figure{
    position:absolute;top:50%;left:0%;transform:translate(-50%,-50%) scaleX(-1);font-size:26px;pointer-events:none;
    transition:filter .3s ease;
  }
  .run-figure.tier3{filter:drop-shadow(0 0 4px var(--neon-blue)) drop-shadow(0 0 9px var(--neon-blue));}
  .run-figure.bump{animation:run-bump .18s ease;}
  @keyframes run-bump{
    0%{transform:translate(-50%,-50%) scaleX(-1) scale(1)}
    50%{transform:translate(-50%,-50%) scaleX(-1) scale(1.25) translateY(-4px)}
    100%{transform:translate(-50%,-50%) scaleX(-1) scale(1)}
  }
  .run-trail{
    position:absolute;top:50%;width:6px;height:6px;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);animation:run-trail-fade .5s ease-out forwards;
  }
  @keyframes run-trail-fade{
    0%{opacity:.7;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  }
  .run-hint{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;text-align:center;margin-top:6px;}

  /* meals: interactive tipping scale */
  .meal-section{margin-bottom:20px;}
  .meal-row{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;margin-bottom:8px;overflow:hidden;
  }
  .meal-row:last-child{margin-bottom:0;}
  .meal-row span{font-size:14px;font-weight:600;}
  .tip-scale{
    display:flex;align-items:center;gap:8px;touch-action:pan-y;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;padding:4px;
  }
  .tip-icon{font-size:19px;opacity:.35;transform:scale(.85) translateY(0);transition:opacity .2s ease,transform .2s ease;}
  .tip-bar{width:52px;height:3px;border-radius:2px;background:var(--border);position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .tip-pivot{
    position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--text-faint);
    transform:translate(-50%,-50%);transition:background .2s ease,box-shadow .2s ease;
  }
  .tip-scale.sel-salad .tip-salad{opacity:1;transform:scale(1.18) translateY(2px);}
  .tip-scale.sel-salad .tip-fries{opacity:.25;transform:scale(.8) translateY(-3px);}
  .tip-scale.sel-salad .tip-bar{transform:rotate(-9deg);}
  .tip-scale.sel-salad .tip-pivot{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green);}
  .tip-scale.sel-fries .tip-fries{opacity:1;transform:scale(1.18) translateY(2px);}
  .tip-scale.sel-fries .tip-salad{opacity:.25;transform:scale(.8) translateY(-3px);}
  .tip-scale.sel-fries .tip-bar{transform:rotate(9deg);}
  .tip-scale.sel-fries .tip-pivot{background:var(--neon-amber);box-shadow:0 0 8px var(--neon-amber);}
  .float-pop{
    position:absolute;right:16px;top:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.4px;pointer-events:none;white-space:nowrap;animation:float-pop .9s ease-out forwards;
  }
  @keyframes float-pop{
    0%{opacity:0;transform:translateY(6px) scale(.8);}
    20%{opacity:1;transform:translateY(-4px) scale(1);}
    100%{opacity:0;transform:translateY(-28px) scale(1);}
  }
  .spark{
    position:absolute;width:4px;height:4px;border-radius:50%;background:var(--neon-amber);pointer-events:none;
    animation:spark-fly .45s ease-out forwards;
  }
  @keyframes spark-fly{
    0%{opacity:1;transform:translate(0,0);}
    100%{opacity:0;transform:translate(var(--dx),var(--dy));}
  }

  /* meditation: mindfulness ripple orb */
  .orb-rig{
    position:relative;height:170px;border-radius:12px;overflow:hidden;margin-bottom:6px;
    background:linear-gradient(180deg,#141a22 0%,#0d1418 70%);border:1px solid var(--border);
    touch-action:none;
  }
  .water{
    position:absolute;left:0;right:0;bottom:0;height:52%;
    background:linear-gradient(180deg, rgba(78,205,196,.12), rgba(20,40,45,.55));
    border-top:1px solid rgba(78,205,196,.28);
  }
  .orb{
    position:absolute;left:50%;top:32%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(78,205,196,.35) 45%, rgba(78,205,196,.12) 80%);
    border:1px solid rgba(78,205,196,.55);
    box-shadow:0 0 18px 4px rgba(78,205,196,.35), inset 0 0 14px rgba(255,255,255,.15);
    -webkit-user-select:none;user-select:none;cursor:grab;-webkit-tap-highlight-color:transparent;
    animation:orb-bob 3.2s ease-in-out infinite;
  }
  @keyframes orb-bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .orb.charging{animation:none;}
  .orb.hidden{visibility:hidden;}
  .ripple{
    position:absolute;left:50%;bottom:6px;width:10px;height:10px;margin-left:-5px;
    border:2px solid rgba(78,205,196,.6);border-radius:50%;
    animation:ripple-expand 1.1s ease-out forwards;pointer-events:none;
  }
  @keyframes ripple-expand{
    0%{width:10px;height:10px;margin-left:-5px;opacity:.9;}
    100%{width:170px;height:46px;margin-left:-85px;opacity:0;}
  }
  .orb-settled{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;
  }
  .orb-settled.show{display:flex;animation:zen-fade-in .4s ease;}
  @keyframes zen-fade-in{0%{opacity:0;}100%{opacity:1;}}
  .lotus-row{display:flex;gap:6px;font-size:34px;filter:drop-shadow(0 0 8px rgba(78,205,196,.6));}

  /* mindfulness: zen garden rake */
  .sand-tray{
    position:relative;height:150px;border-radius:12px;overflow:hidden;margin-bottom:6px;
    background:repeating-linear-gradient(135deg,#2a2118 0 10px,#241d15 10px 20px);
    border:1px solid var(--border);touch-action:none;-webkit-user-select:none;user-select:none;
    cursor:pointer;
  }
  .sand-rocks{position:absolute;inset:0;transition:opacity .3s ease;}
  .sand-rocks span{position:absolute;font-size:20px;transform:translate(-50%,-50%);transition:transform .5s ease, opacity .5s ease;}
  .rake-trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .rake-trail path{
    fill:none;stroke:var(--neon-amber);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 5px rgba(247,208,112,.7));opacity:.9;
  }
  .zen-badge{
    position:absolute;inset:14px;display:none;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:18px;letter-spacing:2px;
    color:var(--neon-amber);border:3px solid var(--neon-amber);border-radius:12px;
    background:rgba(247,208,112,.08);cursor:pointer;text-shadow:0 0 10px rgba(247,208,112,.8);
  }
  .zen-badge.show{
    display:flex;
    animation:kb-stamp-pop .35s cubic-bezier(.34,1.56,.64,1), zen-badge-glow 1.6s ease-in-out infinite .35s;
  }
  @keyframes zen-badge-glow{
    0%,100%{box-shadow:0 0 16px 2px rgba(247,208,112,.5), inset 0 0 12px rgba(247,208,112,.2);}
    50%{box-shadow:0 0 26px 6px rgba(247,208,112,.7), inset 0 0 18px rgba(247,208,112,.4);}
  }
  .wind-particle{
    position:absolute;top:50%;width:14px;height:2px;background:rgba(247,208,112,.6);border-radius:2px;pointer-events:none;
    animation:wind-fly .6s ease-out forwards;
  }
  @keyframes wind-fly{
    0%{opacity:.8;transform:translateX(0);}
    100%{opacity:0;transform:translateX(var(--dx));}
  }
  .zen-bloom{
    position:fixed;bottom:20%;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:60;
    filter:blur(1px);animation-name:zen-bloom-rise;animation-timing-function:ease-out;animation-fill-mode:forwards;
  }
  @keyframes zen-bloom-rise{
    0%{transform:translate(0,0) scale(.6);opacity:0;}
    15%{opacity:.9;}
    100%{transform:translate(var(--dx),-60vh) scale(1.4);opacity:0;}
  }

  .score-name{font-size:13px;font-weight:700;margin-bottom:14px;}
  .score-num{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:34px;line-height:1;}

  .comp-dots{display:flex;gap:3px;justify-content:center;margin-top:4px;flex-wrap:wrap;}

  .heat-steps{font-size:8px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .run-div{width:1px;height:34px;background:var(--border);}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .loading{color:var(--text-muted);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:40px 0;text-align:center;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .confetti-piece{
    position:fixed;top:30%;width:8px;height:14px;border-radius:2px;pointer-events:none;z-index:60;
    animation-name:confetti-fall;animation-timing-function:cubic-bezier(.15,.8,.4,1);animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1;}
    100%{transform:translate(var(--dx),60vh) rotate(var(--rot));opacity:0;}
  }
  .sticker-pop{
    position:fixed;top:36%;left:50%;font-size:88px;z-index:61;pointer-events:none;
    animation:sticker-bounce 1.3s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes sticker-bounce{
    0%{transform:translate(-50%,-50%) scale(.2) rotate(-15deg);opacity:0;}
    30%{transform:translate(-50%,-50%) scale(1.15) rotate(6deg);opacity:1;}
    50%{transform:translate(-50%,-50%) scale(.95) rotate(-4deg);opacity:1;}
    75%{transform:translate(-50%,-50%) scale(1.05) rotate(0deg);opacity:1;}

  }

  @media (max-width:420px){

<body>
<div id="root"><div class="loading">loading&hellip;</div></div>

<script>
// --- Backend config ---------------------------------------------------
// This app used to run inside a Claude.ai artifact, which gives free
// built-in storage via `window.storage`. A plain GitHub Pages site has
// no backend of its own, so this now talks to a free Supabase project
// instead. See README.md for the 2-minute setup (no credit card needed).
const SUPABASE_URL = 'https://imcehspmxqtinofiwymt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltY2Voc3BteHF0aW5vZml3eW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxOTU4NzEsImV4cCI6MjEwMjc3MTg3MX0.1Qh4KiMZuk_XXXtcc3ooAABQppfXExMlFGKcxYIN9UY';
const ROW_ID = 'shared';
// ------------------------------------------------------------------------

const STEP_GOAL = 10000;
const STEPS_SLIDER_MAX = 15000;
const WEEKLY_GOAL = 4; // days/week floor for "hit your target" stats and streaks

// ---------- component library ----------
// Each component owns a slice of the entry object, its own card markup + widget wiring,
// and how it contributes to weekly stats / the heatmap. Adding a new trackable thing means
// adding one entry here — renderApp/renderScoreCol loop over whatever a user has picked.
const COMPONENT_ORDER = ['workout','steps','meals','meditation','mindfulness'];
const COMPONENTS = {
  workout: {
    id:'workout', label:'Workout', icon:'🏋️', color:'var(--lava)', zen:false,
    defaultEntry:()=>({workout:false}),
    dayDone:(e)=> !!(e && e.workout),
    weekAgg:(cells)=>{
      const count = cells.filter(c=>c.entry && c.entry.workout).length;
      return [{value:count, suffix:'/5', label:'workouts', goalMet: count>=WEEKLY_GOAL}];
    },
    renderHtml:(e)=>`
      <div class="row-label">Workout</div>
      <div class="kb-rig" id="kbRig">
        <div class="kb-track"></div>
        <div class="kb-floor"></div>
        <div class="kb-bell" id="kbBell"><div class="kb-handle"></div><div class="kb-ball"></div></div>
        <div class="kb-stamp" id="kbStamp">CRUSHED</div>
      </div>
      <div class="lift-status" id="status-workout">${e.workout ? 'Crushed it — tap the stamp to undo' : 'Drag it down, or tap to drop it'}</div>
    `,
    wire:(entry, patch)=>{
      const statusEl = document.getElementById('status-workout');
      setupKettlebell(document.getElementById('kbRig'), document.getElementById('kbBell'), document.getElementById('kbStamp'), entry.workout, (crushed)=>{
        statusEl.textContent = crushed ? 'Crushed it — tap the stamp to undo' : 'Drag it down, or tap to drop it';
        patch({workout: crushed});
      });
    }
  },
  steps: {
    id:'steps', label:'Steps', icon:'👟', color:'var(--neon-blue)', zen:false,
    defaultEntry:()=>({steps:0}),
    dayDone:(e)=> !!(e && typeof e.steps==='number' && e.steps>=STEP_GOAL),
    dayMetric:(e)=> e && e.steps ? fmtSteps(e.steps) : null,
    weekAgg:(cells)=>{
      let sum=0, days=0;
      cells.forEach(c=>{ if(c.entry && typeof c.entry.steps==='number' && c.entry.steps>0){ sum+=c.entry.steps; days++; } });
      const avg = days ? Math.round(sum/days) : 0;
      return [{value:fmtSteps(avg), suffix:'', label:'avg steps / day', goalMet: avg>=STEP_GOAL}];
    },
    renderHtml:(e)=>`
      <div class="steps-row">
        <div class="row-label">Steps</div>
        <div class="steps-readout"><span id="stepsVal">0</span><span class="goal-chip">goal 10k</span></div>
        <div class="run-track" id="runTrack">
          <div class="run-track-fill" id="runFill"></div>
          <div class="run-goal-mark" id="runGoalMark"></div>
          <div class="run-figure" id="runFigure">🚶</div>
        </div>
        <div class="run-hint">Drag or tap the trail</div>
      </div>
    `,
    wire:(entry, patch)=>{
      setupStepsTrack(document.getElementById('runTrack'), document.getElementById('runFill'), document.getElementById('runFigure'), document.getElementById('runGoalMark'), Number(entry.steps)||0, (v)=>{
        patch({steps:v});
      });
    }
  },
  meals: {
    id:'meals', label:'Meals', icon:'🍽️', color:'var(--neon-amber)', zen:false,
    defaultEntry:()=>({meals:{breakfast:false,lunch:false,dinner:false}}),
    dayDone:(e)=> !!(e && e.meals && !e.meals.breakfast && !e.meals.lunch && !e.meals.dinner),
    weekAgg:(cells)=>{
      let cheat=0;
      cells.forEach(c=>{ if(c.entry && c.entry.meals){ if(c.entry.meals.breakfast)cheat++; if(c.entry.meals.lunch)cheat++; if(c.entry.meals.dinner)cheat++; } });
      return [{value:cheat, suffix:'/21', label:'cheat meals', goalMet:false}];
    },
    renderHtml:(e)=>{
      const mealsSafe = e.meals || {breakfast:false,lunch:false,dinner:false};
      return `
      <div class="meal-section">
        <div class="row-label">Meals — swipe salad or fries</div>
        ${['breakfast','lunch','dinner'].map(m=>`
        <div class="meal-row">
          <span>${m[0].toUpperCase()+m.slice(1)}</span>
          <div class="tip-scale" id="tip-${m}" data-meal="${m}">
            <span class="tip-icon tip-salad">🥗</span>
            <div class="tip-bar"><div class="tip-pivot"></div></div>
            <span class="tip-icon tip-fries">🍟</span>
          </div>
        </div>`).join('')}
      </div>`;
    },
    wire:(entry, patch)=>{
      const mealsSafe = entry.meals || {breakfast:false,lunch:false,dinner:false};
      const localMeals = {...mealsSafe};
      ['breakfast','lunch','dinner'].forEach(m=>{
        setupTipScale(document.getElementById('tip-'+m), mealsSafe[m], (cheat)=>{
          localMeals[m] = cheat;
          patch({meals:{...localMeals}});
        });
      });
    }
  },
  meditation: {
    id:'meditation', label:'Meditation', icon:'🧘', color:'var(--zen-teal)', zen:true,
    defaultEntry:()=>({meditationDone:false}),
    dayDone:(e)=> !!(e && e.meditationDone),
    weekAgg:(cells)=>{
      const count = cells.filter(c=>c.entry && c.entry.meditationDone).length;
      return [{value:count, suffix:'/7', label:'meditation days', goalMet: count>=WEEKLY_GOAL}];
    },
    renderHtml:(e)=>`
      <div class="row-label">Meditation</div>
      <div class="orb-rig" id="orbRig">
        <div class="water"></div>
        <div class="orb" id="orb"></div>
        <div class="orb-settled" id="orbSettled"><div class="lotus-row" id="lotusRow"></div></div>
      </div>
      <div class="lift-status" id="status-meditation">${e.meditationDone ? 'Session logged — tap the water to undo' : 'Press & hold the orb to breathe'}</div>
    `,
    wire:(entry, patch)=>{
      const statusEl = document.getElementById('status-meditation');
      setupOrb(document.getElementById('orbRig'), document.getElementById('orb'), document.getElementById('orbSettled'), document.getElementById('lotusRow'), entry.meditationDone, (done)=>{
        statusEl.textContent = done ? 'Session logged — tap the water to undo' : 'Press & hold the orb to breathe';
        patch({meditationDone: done});
      });
    }
  },
  mindfulness: {
    id:'mindfulness', label:'Mindfulness', icon:'🌊', color:'var(--zen-lavender)', zen:true,
    defaultEntry:()=>({mindfulnessDone:false}),
    dayDone:(e)=> !!(e && e.mindfulnessDone),
    weekAgg:(cells)=>{
      const count = cells.filter(c=>c.entry && c.entry.mindfulnessDone).length;
      return [{value:count, suffix:'/7', label:'mind cleared', goalMet:false}];
    },
    renderHtml:(e)=>`
      <div class="row-label">Mindfulness — clear the field</div>
      <div class="sand-tray" id="sandTray">
        <div class="sand-rocks" id="sandRocks">
          <span style="left:18%;top:32%;">🪨</span>
          <span style="left:64%;top:58%;">🪨</span>
          <span style="left:42%;top:74%;">🪨</span>
          <span style="left:80%;top:28%;">🪨</span>
          <span style="left:26%;top:62%;">🪨</span>
        </div>
        <svg class="rake-trail" id="rakeTrail"></svg>
        <div class="zen-badge" id="zenBadge">MIND CLEARED</div>
      </div>
      <div class="lift-status" id="status-mindfulness">${e.mindfulnessDone ? 'Field cleared — tap to reset' : 'Swipe across the sand'}</div>
    `,
    wire:(entry, patch)=>{
      const statusEl = document.getElementById('status-mindfulness');
      setupSandRake(document.getElementById('sandTray'), document.getElementById('sandRocks'), document.getElementById('rakeTrail'), document.getElementById('zenBadge'), entry.mindfulnessDone, (done)=>{
        statusEl.textContent = done ? 'Field cleared — tap to reset' : 'Swipe across the sand';
        patch({mindfulnessDone: done});
      });
    }
  }
};
function userComponents(name){ return (appData.userComponents && appData.userComponents[name]) || []; }
function blankEntry(name){
  const e = { note:'' };
  userComponents(name).forEach(id=>{ if(COMPONENTS[id]) Object.assign(e, COMPONENTS[id].defaultEntry()); });
  return e;
}
// one-time migration from the old single-bundle userType field to per-user component lists
function migrateUserComponents(){
  if(!appData.userComponents) appData.userComponents = {};
  let changed = false;
  appData.users.forEach(name=>{
    if(!appData.userComponents[name]){
      const t = appData.userType && appData.userType[name];
      appData.userComponents[name] = t === 'mindfulness' ? ['meditation','mindfulness'] : ['workout','steps','meals'];
      changed = true;
    }
  });
  if(appData.userType){ delete appData.userType; changed = true; }
  return changed;
}

// ---------- player identity colors ----------
const PLAYER_THEMES = [
  {color:'#ff5c3d', dim:'rgba(255,92,61,.5)',  dim2:'rgba(255,92,61,.12)',  bg:'#241a16'},
  {color:'#43c9dd', dim:'rgba(67,201,221,.5)', dim2:'rgba(67,201,221,.12)', bg:'#16232a'},
  {color:'#a899e6', dim:'rgba(168,153,230,.5)',dim2:'rgba(168,153,230,.12)',bg:'#221e30'},
  {color:'#ffb020', dim:'rgba(255,176,32,.5)', dim2:'rgba(255,176,32,.12)', bg:'#2a2216'},
  {color:'#39ff6a', dim:'rgba(57,255,106,.5)', dim2:'rgba(57,255,106,.12)', bg:'#16261c'},
  {color:'#ff6fae', dim:'rgba(255,111,174,.5)',dim2:'rgba(255,111,174,.12)',bg:'#2a1622'}
];
function playerTheme(i){ return PLAYER_THEMES[i % PLAYER_THEMES.length]; }

let appData = null;
let currentUserIdx = 0;
let selectedDate = new Date();
let flashNextRender = false;
let addingPerson = false;
let editingComponentsFor = null;
let activeTab = 'today';

// ---------- date helpers ----------
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function stripTime(d){ const c = new Date(d); c.setHours(0,0,0,0); return c; }
function startOfWeek(d){
  const c = stripTime(d);
  const day = c.getDay(); // 0 Sun .. 6 Sat
  const diff = (day + 6) % 7; // days since Monday
  c.setDate(c.getDate() - diff);
  return c;
}
function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function weekDates(start){ return Array.from({length:7}, (_,i)=>addDays(start,i)); }
const DAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function fmtWeekLabel(start){
  const end = addDays(start,6);
  const opts = {month:'short', day:'numeric'};
  return `${start.toLocaleDateString('en-US',opts)} – ${end.toLocaleDateString('en-US',opts)}`;
}
function fmtSteps(n){
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}

// ---------- haptics ----------
const HAPTIC_PATTERNS = { light: 10, medium: 22, heavy: [25,15,45] };
function haptic(tier){
  if(navigator.vibrate) navigator.vibrate(HAPTIC_PATTERNS[tier] || 10);
}

// ---------- storage (Supabase REST) ----------
function sbHeaders(extra){
  return Object.assign({
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`
  }, extra || {});
}
async function loadData(){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/streak_data?id=eq.${ROW_ID}&select=data`,
      { headers: sbHeaders() }
    );
    if(!res.ok) return null;
    const rows = await res.json();
    if(!rows.length) return null; // no row yet -> needs setup
    return rows[0].data;
  }catch(e){
    return null;
  }
}
async function saveData(){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/streak_data?on_conflict=id`,
    {
      method: 'POST',
      headers: sbHeaders({
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      }),
      body: JSON.stringify({ id: ROW_ID, data: appData, updated_at: new Date().toISOString() })
    }
  );
  if(!res.ok) throw new Error('save failed: ' + res.status);
}
function entryFor(userName, d){
  return appData.entries[`${userName}|${dateKey(d)}`] || null;
}
function setEntry(userName, d, entry){
  appData.entries[`${userName}|${dateKey(d)}`] = entry;
}

// ---------- stats ----------
function weekCellsFor(userName, weekStart, today){
  return weekDates(weekStart).map(d=>{
    const isFuture = stripTime(d) > stripTime(today);
    return { date:d, entry: isFuture ? null : entryFor(userName, d), isFuture };
  });
}
// The goal streak is driven by the user's first (primary) component — whatever they
// picked first counts as their "main" habit for streak purposes.
function weeklyGoalMet(userName, cells){
  const pid = userComponents(userName)[0];
  if(!pid || !COMPONENTS[pid]) return false;
  const count = cells.filter(c=>c.entry && COMPONENTS[pid].dayDone(c.entry)).length;
  return count >= WEEKLY_GOAL;
}
function currentRun(userName, today){
  // consecutive completed weeks (before this week) hitting the weekly goal
  let ws = addDays(startOfWeek(today), -7);
  const firstCells = weekCellsFor(userName, ws, addDays(ws,6));
  const hasData = firstCells.some(c=>c.entry);
  if(!hasData) return {run:0, hasData:false};
  let run = 0;
  while(true){
    const cells = weekCellsFor(userName, ws, addDays(ws,6));
    if(!cells.some(c=>c.entry)) break;
    if(weeklyGoalMet(userName, cells)){ run++; ws = addDays(ws,-7); }
    else break;
  }
  return {run, hasData:true};
}

// ---------- render ----------
const root = document.getElementById('root');
let toastTimer = null;
function showToast(msg){
  let t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function renderSetup(){
  root.innerHTML = `
    <h1 class="wordmark">STREAK</h1>
    <p class="tagline">// a shared log for two people chasing the same habits</p>
    <div class="setup-card">
      <h2>Set up your pair</h2>
      <p>One shared board, two names. You'll each pick your own name each time you log &mdash; no password, just for two people who trust each other.</p>
      <div class="field"><label>Your name</label><input id="u1" placeholder="e.g. Alex" maxlength="20"/></div>
      <div class="field"><label>Their name</label><input id="u2" placeholder="e.g. Sam" maxlength="20"/></div>
      <button class="primary-btn" id="setupBtn">Create shared board</button>
    </div>`;
  const u1 = document.getElementById('u1'), u2 = document.getElementById('u2'), btn = document.getElementById('setupBtn');
  btn.onclick = async ()=>{
    const n1 = u1.value.trim(), n2 = u2.value.trim();
    if(!n1 || !n2 || n1.toLowerCase()===n2.toLowerCase()) return;
    btn.disabled = true; btn.textContent = 'Setting up…';
    appData = { users:[n1,n2], userComponents:{ [n1]:['workout','steps','meals'], [n2]:['workout','steps','meals'] }, entries:{} };
    await saveData();
    currentUserIdx = 0;
    renderApp();
  };
}

function playerCardsHtml(){
  return `
    <div class="vs-row">
      ${appData.users.map((n,i)=>{
        const t = playerTheme(i);
        const comps = userComponents(n);
        const isZen = COMPONENTS[comps[0]] && COMPONENTS[comps[0]].zen;
        return `
        <button class="player-card ${i===currentUserIdx?'active':''}" data-idx="${i}"
          style="--pc:${t.color};--pc-dim:${t.dim};--pc-dim2:${t.dim2};--pc-bg:${t.bg};">
          <span class="player-badge" data-badge="${isZen?'✦':'●'} P${i+1}"></span>
          <span class="player-name">${n}</span>
        </button>`;
      }).join('')}
      <button type="button" class="add-player-btn" id="addPlayerBtn" aria-label="Add player" title="Add player">＋</button>
    </div>`;
}

function renderAddPerson(){
  root.innerHTML = `
    <h1 class="wordmark">STREAK</h1>
    <p class="tagline">// add someone new to the board</p>
    <div class="setup-card">
      <h2>New player</h2>
      <div class="field"><label>Name</label><input id="newName" placeholder="e.g. Sam" maxlength="20"/></div>
      <div class="field">
        <label>Track</label>
        <div class="comp-picker">
          ${COMPONENT_ORDER.map(id=>`
            <label class="comp-check"><input type="checkbox" value="${id}"/><span>${COMPONENTS[id].icon} ${COMPONENTS[id].label}</span></label>
          `).join('')}
        </div>
      </div>
      <button class="primary-btn" id="createPlayerBtn">Create</button>
      <button type="button" class="ghost-btn" id="cancelAddBtn">Cancel</button>
    </div>`;
  document.getElementById('cancelAddBtn').onclick = ()=>{ addingPerson = false; renderApp(); };
  document.getElementById('createPlayerBtn').onclick = async ()=>{
    const nameInput = document.getElementById('newName');
    const name = nameInput.value.trim();
    const checked = Array.from(document.querySelectorAll('.comp-check input:checked')).map(i=>i.value);
    if(!name || appData.users.some(u=>u.toLowerCase()===name.toLowerCase()) || !checked.length) return;
    appData.users.push(name);
    appData.userComponents[name] = checked;
    addingPerson = false;
    currentUserIdx = appData.users.length - 1;
    await saveData();
    renderApp();
  };
}

function renderApp(){
  if(addingPerson){ renderAddPerson(); return; }

  const today = stripTime(new Date());
  const wkStart = startOfWeek(today);
  const minDate = wkStart, maxDate = today;
  const user = appData.users[currentUserIdx];
  const comps = userComponents(user);
  const editing = editingComponentsFor === user;
  root.classList.toggle('zen-mode', !editing && COMPONENTS[comps[0]] && COMPONENTS[comps[0]].zen);

  const isToday = dateKey(selectedDate) === dateKey(today);
  const dLabel = isToday ? 'Today' : selectedDate.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
  const prevDisabled = stripTime(selectedDate) <= minDate;
  const nextDisabled = stripTime(selectedDate) >= maxDate;

  const e = { ...blankEntry(user), ...(entryFor(user, selectedDate) || {}) };

  let cardBodyHtml, cardFooterHtml;
  if(editing){
    cardBodyHtml = `
      <div class="row-label">Choose what ${user} tracks</div>
      <div class="comp-picker">
        ${COMPONENT_ORDER.map(id=>`
          <label class="comp-check"><input type="checkbox" value="${id}" ${comps.includes(id)?'checked':''}/><span>${COMPONENTS[id].icon} ${COMPONENTS[id].label}</span></label>
        `).join('')}
      </div>`;
    cardFooterHtml = `
      <div class="save-row">
        <button class="primary-btn" id="saveComponentsBtn">Save components</button>
        <button type="button" class="ghost-btn" id="cancelComponentsBtn">Cancel</button>
      </div>`;
  }else{
    cardBodyHtml = comps.length
      ? comps.map(id=>COMPONENTS[id].renderHtml(e)).join('')
      : `<p style="color:var(--text-muted);font-size:14px;margin:0 0 16px;">Nothing set up yet — add a component below.</p>`;
    cardBodyHtml += `<button type="button" class="add-component-btn" id="addComponentBtn">+ Add component</button>`;
    cardFooterHtml = `
      <div class="save-row">
        <button class="primary-btn" id="saveBtn">Save ${dLabel.toLowerCase()}</button>
      </div>`;
  }

  const todayViewHtml = `
    <div class="card">
      <div class="card-head">
        <h3>Log for ${user}</h3>
        <div class="date-nav">
          <button id="prevDay" ${prevDisabled?'disabled':''}>&larr;</button>
          <span>${dLabel}</span>
          <button id="nextDay" ${nextDisabled?'disabled':''}>&rarr;</button>
        </div>
      </div>
      ${cardBodyHtml}
      ${cardFooterHtml}
    </div>`;
  const leaderboardViewHtml = `
    ${renderScoreboard(wkStart, today)}
    ${renderRun(today)}
    <div class="legend">
      ${appData.users.map((u,i)=>`<span><i style="background:${playerTheme(i).color}"></i>${u}</span>`).join('')}
    </div>`;

  root.innerHTML = `
    <h1 class="wordmark">STREAK</h1>
    <p class="tagline">// week of ${fmtWeekLabel(wkStart)}</p>
    ${playerCardsHtml()}
    <div class="view-tabs">
      <button class="view-tab ${activeTab==='today'?'active':''}" data-tab="today">Today</button>
      <button class="view-tab ${activeTab==='leaderboard'?'active':''}" data-tab="leaderboard">Leaderboard</button>
    </div>
    ${activeTab==='today' ? todayViewHtml : leaderboardViewHtml}
  `;

  // wire up events common to every view
  document.querySelectorAll('.player-card').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.idx);
      if(idx === currentUserIdx) return;
      currentUserIdx = idx;
      editingComponentsFor = null;
      flashNextRender = true;
      const nComps = userComponents(appData.users[idx]);
      if(COMPONENTS[nComps[0]] && COMPONENTS[nComps[0]].zen){
        playChime();
        spawnAuraFade();
      }
      renderApp();
    };
  });
  document.getElementById('addPlayerBtn').onclick = ()=>{ addingPerson = true; renderApp(); };
  document.querySelectorAll('.view-tab').forEach(btn=>{
    btn.onclick = ()=>{ activeTab = btn.dataset.tab; renderApp(); };
  });
  if(flashNextRender){
    const activeCard = document.querySelector('.player-card.active');
    if(activeCard){
      activeCard.classList.add('flash');
      setTimeout(()=>activeCard.classList.remove('flash'), 320);
    }
    flashNextRender = false;
  }

  if(activeTab !== 'today') return;

  document.getElementById('prevDay').onclick = ()=>{ if(!prevDisabled){ selectedDate = addDays(selectedDate,-1); renderApp(); } };
  document.getElementById('nextDay').onclick = ()=>{ if(!nextDisabled){ selectedDate = addDays(selectedDate,1); renderApp(); } };

  if(editing){
    document.getElementById('cancelComponentsBtn').onclick = ()=>{ editingComponentsFor = null; renderApp(); };
    document.getElementById('saveComponentsBtn').onclick = async ()=>{
      const checked = Array.from(document.querySelectorAll('.comp-check input:checked')).map(i=>i.value);
      appData.userComponents[user] = checked;
      editingComponentsFor = null;
      await saveData();
      renderApp();
    };
    return;
  }

  document.getElementById('addComponentBtn').onclick = ()=>{ editingComponentsFor = user; renderApp(); };

  let localEntry = { ...e };
  comps.forEach(id=>{
    COMPONENTS[id].wire(localEntry, (patch)=>{ Object.assign(localEntry, patch); });
  });

  document.getElementById('saveBtn').onclick = async (ev)=>{
    const btn = ev.currentTarget;
    setEntry(user, selectedDate, { ...localEntry, note: '' });
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Saving…';
    try{
      await saveData();
      const allDone = comps.length>0 && comps.every(id=>COMPONENTS[id].dayDone(localEntry));
      if(allDone){
        const zen = COMPONENTS[comps[0]] && COMPONENTS[comps[0]].zen;
        if(zen){ celebrateZen(); showToast(`🧘 Centered day, ${user}!`); }
        else{ celebrate(); showToast(`🔥 Perfect day, ${user}!`); }
      }else{
        showToast(`Saved ${user}'s ${isToday?'today':dLabel}`);
      }
    }catch(err){
      showToast('Save failed — try again');
    }
    renderApp();
  };
}

// ---------- workout: kettlebell gravity drop (crashes at the bottom of the screen) ----------
function kbShatter(x, y){
  for(let i=0;i<14;i++){
    const s = document.createElement('div');
    s.className = 'kb-shard';
    const size = 5 + Math.random()*7;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (x - size/2) + 'px';
    s.style.top = (y - size/2) + 'px';
    const angle = Math.random()*Math.PI*2;
    const dist = 22 + Math.random()*50;
    s.style.setProperty('--dx', (Math.cos(angle)*dist) + 'px');
    s.style.setProperty('--dy', (-Math.abs(Math.sin(angle))*dist*0.6 + Math.random()*20) + 'px');
    s.style.setProperty('--rot', (Math.random()*480-240) + 'deg');
    s.style.animationDelay = (Math.random()*0.05) + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', ()=>s.remove());
  }
}
function setupKettlebell(rig, bell, stamp, initialCrushed, onChange){
  const TOP = 16;
  let crushed = !!initialCrushed;

  function resetBellStyle(){
    bell.style.position = '';
    bell.style.left = '';
    bell.style.margin = '';
    bell.style.top = TOP + 'px';
  }
  function idleVisual(){
    bell.classList.remove('hidden','returning','dragging','launching');
    resetBellStyle();
    stamp.classList.remove('show');
  }
  function crushedVisual(){
    bell.classList.remove('dragging','returning','launching');
    bell.classList.add('hidden');
    resetBellStyle();
    stamp.classList.add('show');
  }
  (crushed ? crushedVisual : idleVisual)();

  function launchToBottom(){
    const r = bell.getBoundingClientRect();
    bell.style.position = 'fixed';
    bell.style.left = r.left + 'px';
    bell.style.top = r.top + 'px';
    bell.style.margin = '0';
    bell.classList.remove('dragging');
    void bell.offsetWidth; // commit the position:fixed jump before animating
    bell.classList.add('launching');
    const targetTop = window.innerHeight - r.height - 10;
    requestAnimationFrame(()=>{ bell.style.top = targetTop + 'px'; });
    setTimeout(impactAtBottom, 330);
  }

  function impactAtBottom(){
    const r = bell.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height*0.4;
    bell.classList.remove('launching');
    bell.classList.add('hidden');
    resetBellStyle();

    haptic('heavy');
    kbShatter(cx, cy);
    const flash = document.createElement('div');
    flash.className = 'screen-crash';
    document.body.appendChild(flash);
    flash.addEventListener('animationend', ()=>flash.remove());
    root.classList.add('crash-shake');
    setTimeout(()=>root.classList.remove('crash-shake'), 320);

    setTimeout(()=>stamp.classList.add('show'), 110);
    crushed = true;
    onChange(true);
  }

  function undo(){
    haptic('light');
    stamp.classList.remove('show');
    bell.classList.remove('hidden');
    resetBellStyle();
    crushed = false;
    onChange(false);
  }
  stamp.addEventListener('click', undo);

  let dragging = false, startY = 0, startTop = 0, moved = 0;
  bell.addEventListener('pointerdown', (ev)=>{
    if(crushed) return;
    dragging = true;
    try{ bell.setPointerCapture(ev.pointerId); }catch(err){}
    bell.classList.add('dragging');
    bell.classList.remove('returning');
    startY = ev.clientY;
    startTop = parseFloat(bell.style.top) || TOP;
    moved = 0;
  });
  bell.addEventListener('pointermove', (ev)=>{
    if(!dragging) return;
    const dy = ev.clientY - startY;
    moved = Math.abs(dy);
    const bottom = rig.clientHeight - 38 - bell.offsetHeight + 6;
    bell.style.top = Math.max(TOP, Math.min(bottom, startTop + dy)) + 'px';
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    bell.classList.remove('dragging');
    if(moved < 6){ launchToBottom(); return; }
    const bottom = rig.clientHeight - 38 - bell.offsetHeight + 6;
    const top = parseFloat(bell.style.top);
    const frac = (top - TOP) / (bottom - TOP);
    if(frac > 0.7){
      launchToBottom();
    }else{
      bell.classList.add('returning');
      bell.style.top = TOP + 'px';
      setTimeout(()=>bell.classList.remove('returning'), 420);
    }
  }
  bell.addEventListener('pointerup', endDrag);
  bell.addEventListener('pointercancel', endDrag);
}

function tierOf(v){ return v >= STEP_GOAL ? 3 : (v > 3000 ? 2 : 1); }
function stepsBurst(track, x){

function setupStepsTrack(track, fill, figure, goalMark, initialSteps, onChange){
  const max = STEPS_SLIDER_MAX;
  const stepsVal = document.getElementById('stepsVal');
  let value = Math.max(0, Math.min(max, initialSteps || 0));
  let lastTrailAt = 0;
  goalMark.style.left = (STEP_GOAL / max * 100) + '%';

  const FIGURE_PAD = 18; // keep the runner's centerpoint clear of the pill's rounded/clipped edges
  const TIER_EMOJI = {1:'🚶', 2:'🏃', 3:'🏃'};

  function spawnTrail(x, tier){
    const now = performance.now();
    if(now - lastTrailAt < 55) return;
    lastTrailAt = now;
    const t = document.createElement('div');
    t.className = 'run-trail';
    t.style.left = x + 'px';
    t.style.background = tier >= 3 ? 'var(--neon-blue)' : (tier === 2 ? '#8a7a63' : 'transparent');
    if(tier >= 3) t.style.boxShadow = '0 0 6px 2px rgba(61,220,255,.6)';
    track.appendChild(t);
    t.addEventListener('animationend', ()=>t.remove());
  }

  function render(prevValue){
    const pct = (value / max) * 100;
    fill.style.width = pct + '%';
    const trackWidth = track.clientWidth;
    const x = trackWidth ? FIGURE_PAD + (pct/100) * (trackWidth - FIGURE_PAD*2) : 0;
    figure.style.left = x + 'px';
    const tier = tierOf(value);
    figure.textContent = TIER_EMOJI[tier];
    figure.classList.toggle('tier3', tier === 3);
    track.classList.toggle('tier2', tier === 2);
    track.classList.toggle('tier3', tier === 3);
    stepsVal.textContent = fmtSteps(value) + (value >= max ? '+' : '');
    if(prevValue !== undefined){
      if(Math.floor(prevValue/1000) !== Math.floor(value/1000)){
        figure.classList.remove('bump');
        void figure.offsetWidth;
        figure.classList.add('bump');
      }
      if(prevValue < STEP_GOAL && value >= STEP_GOAL){
        haptic('medium');
        stepsBurst(track, x);
      }
      if(tier >= 2) spawnTrail(x, tier);
    }
    return x;
  }
  render();

  function setFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const snapped = Math.round((ratio * max) / 100) * 100;
    if(snapped === value) return;
    const prev = value;
    value = snapped;
    render(prev);
    if(Math.floor(prev/2000) !== Math.floor(value/2000)) haptic('light');
    onChange(value);
  }

  let dragging = false;
  track.addEventListener('pointerdown', (ev)=>{
    dragging = true;
    try{ track.setPointerCapture(ev.pointerId); }catch(err){}
    setFromClientX(ev.clientX);
  });
  track.addEventListener('pointermove', (ev)=>{
    if(!dragging) return;
    setFromClientX(ev.clientX);
  });
  function endDrag(){ dragging = false; }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
}

// ---------- zen: shared audio + fx helpers ----------
let audioCtx = null;
function playChime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [220, 330, 440].forEach((f,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.06/(i+1), now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 2.3);
    });
  }catch(err){}
}
function startBreathTone(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 180;
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    return { osc, gain };
  }catch(err){ return null; }
}
function stopBreathTone(tone){
  if(!tone || !audioCtx) return;
  try{
    const now = audioCtx.currentTime;
    tone.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    tone.osc.stop(now + 0.35);
  }catch(err){}
}
function spawnAuraFade(){
  const a = document.createElement('div');
  a.className = 'aura-fade';
  document.body.appendChild(a);
  a.addEventListener('animationend', ()=>a.remove());
}

// ---------- meditation: mindfulness ripple orb ----------
function createRipple(rig, delay){
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.animationDelay = delay + 's';
  rig.appendChild(r);
  r.addEventListener('animationend', ()=>r.remove());
}
const ORB_HOLD_MS = 900; // how long counts as a "long tap"
function setupOrb(rig, orb, settled, lotusRow, initialDone, onChange){
  let done = !!initialDone;

  function idleVisual(){
    orb.classList.remove('hidden','charging');
    orb.style.transform = '';
    settled.classList.remove('show');
  }
  function settledVisual(){
    orb.classList.add('hidden');
    orb.style.transform = '';
    lotusRow.textContent = '🪷';
    settled.classList.add('show');
  }
  (done ? settledVisual : idleVisual)();

  let holding = false, startTime = 0, rafId = null, tone = null, hapticTimer = null;
  function tick(){
    if(!holding) return;
    const ratio = Math.min(1, (performance.now() - startTime) / ORB_HOLD_MS);
    orb.style.transform = `scale(${1 + ratio*0.7})`;
    if(tone) tone.osc.frequency.value = 180 + ratio*140;
    rafId = requestAnimationFrame(tick);
  }

  orb.addEventListener('pointerdown', (ev)=>{
    if(done) return;
    holding = true;
    startTime = performance.now();
    try{ orb.setPointerCapture(ev.pointerId); }catch(err){}
    orb.classList.add('charging');
    tone = startBreathTone();
    hapticTimer = setInterval(()=>haptic('light'), 380);
    rafId = requestAnimationFrame(tick);
  });
  function release(){
    if(!holding) return;
    holding = false;
    cancelAnimationFrame(rafId);
    clearInterval(hapticTimer);
    stopBreathTone(tone);
    tone = null;
    const heldMs = performance.now() - startTime;
    orb.classList.remove('charging');
    orb.style.transform = '';
    if(heldMs < ORB_HOLD_MS) return; // too brief — resets to idle bob, no session logged

    haptic('medium');
    orb.classList.add('hidden');
    createRipple(rig, 0);
    createRipple(rig, 0.15);
    createRipple(rig, 0.3);
    setTimeout(()=>{
      done = true;
      settledVisual();
      onChange(true);
    }, 420);
  }
  orb.addEventListener('pointerup', release);
  orb.addEventListener('pointercancel', release);

  settled.addEventListener('click', ()=>{
    if(!done) return;
    haptic('light');
    createRipple(rig, 0);
    settled.classList.remove('show');
    done = false;
    idleVisual();
    onChange(false);
  });
}

function setupSandRake(tray, rocksEl, svgEl, badge, initialDone, onChange){
  const NS = 'http://www.w3.org/2000/svg';
  let done = !!initialDone;
  let path = null;

  function resetRocks(){
    rocksEl.querySelectorAll('span').forEach(r=>{
      r.style.transform = '';
      r.style.opacity = '1';
      delete r.dataset.pushed;
    });
  }
  function idleVisual(){
    rocksEl.style.opacity = '1';
    badge.classList.remove('show');
    svgEl.innerHTML = '';
  }
  function doneVisual(){
    rocksEl.style.opacity = '0';
    svgEl.innerHTML = '';
    badge.classList.add('show');
  }
  (done ? doneVisual : idleVisual)();

  const THRESHOLD = 240;
  let dragging = false, pts = [], totalDist = 0, lastPt = null, lastTick = 0;

  tray.addEventListener('pointerdown', (ev)=>{
    if(done) return;
    dragging = true;
    try{ tray.setPointerCapture(ev.pointerId); }catch(err){}
    const rect = tray.getBoundingClientRect();
    const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    pts = [[x,y]]; totalDist = 0; lastPt = [x,y];
    path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${x},${y}`);
    svgEl.appendChild(path);
  });
  tray.addEventListener('pointermove', (ev)=>{
    if(!dragging) return;
    const rect = tray.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, ev.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, ev.clientY - rect.top));
    const d = Math.hypot(x - lastPt[0], y - lastPt[1]);
    if(d <= 3) return;
    totalDist += d;
    pts.push([x,y]);
    lastPt = [x,y];
    path.setAttribute('d', pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' '));
    rocksEl.querySelectorAll('span').forEach(r=>{
      if(r.dataset.pushed) return;
      const rx = parseFloat(r.style.left)/100 * rect.width;
      const ry = parseFloat(r.style.top)/100 * rect.height;
      if(Math.hypot(rx - x, ry - y) < 30){
        r.dataset.pushed = '1';
        const ang = Math.atan2(ry - y, rx - x);
        r.style.transform = `translate(calc(-50% + ${Math.cos(ang)*80}px), calc(-50% + ${Math.sin(ang)*80}px)) scale(.4)`;
        r.style.opacity = '0';
        haptic('light');
      }
    });
    const now = performance.now();
    if(now - lastTick > 120){ lastTick = now; haptic('light'); }
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    if(totalDist >= THRESHOLD){
      haptic('medium');
      setTimeout(()=>{
        done = true;
        doneVisual();
        onChange(true);
      }, 200);
    }else if(path){
      path.style.transition = 'opacity .4s ease';
      path.style.opacity = '0';
      resetRocks();
      setTimeout(()=>{ svgEl.innerHTML = ''; }, 400);
    }
  }
  tray.addEventListener('pointerup', endDrag);
  tray.addEventListener('pointercancel', endDrag);

  badge.addEventListener('click', ()=>{
    if(!done) return;
    haptic('light');
    windSweep(tray);
    setTimeout(()=>{
      done = false;
      idleVisual();
      resetRocks();
      onChange(false);
    }, 300);
  });
}

function renderScoreboard(wkStart, today){
  return `
    <div class="card">
      <div class="score-head">
        <h3>This week</h3>
        <span class="week-label">Mon&ndash;Sun</span>
      </div>
      <div class="score-grid">
        ${appData.users.map((u,i)=>renderScoreCol(u,i,wkStart,today)).join('')}
      </div>
    </div>`;
}

function renderScoreCol(userName, idx, wkStart, today){
  const cells = weekCellsFor(userName, wkStart, today);
  const comps = userComponents(userName);
  const t = playerTheme(idx);
  const lines = [];
  comps.forEach(id=>{ COMPONENTS[id].weekAgg(cells).forEach(l=>lines.push(l)); });

  return `
    <div class="score-col" style="--pc:${t.color}">
      <div class="score-name">${userName}</div>
      ${lines.length ? lines.map((l,i)=>`
        <div class="score-stat" ${i===lines.length-1?'style="margin-bottom:0;"':''}>
          <div class="score-num ${l.goalMet?'goal-met':''}">${l.value}${l.suffix?`<small>${l.suffix}</small>`:''}</div>
          <div class="score-stat-label">${l.label}</div>
        </div>`).join('') : `<p style="color:var(--text-faint);font-size:12px;">nothing tracked yet</p>`}
      <div class="heatrow">
        ${cells.map((c,i)=>{
          const primary = COMPONENTS[comps[0]];
          const secondary = comps.slice(1);
          const done = primary && c.entry ? primary.dayDone(c.entry) : false;
          const metric = primary && primary.dayMetric && c.entry ? primary.dayMetric(c.entry) : null;
          return `
          <div class="heat-cell">
            <div class="heat-day-label">${DAY_LABELS[i][0]}</div>
            <div class="heat-box ${done?'done':''} ${c.isFuture?'future':''}"></div>
            ${secondary.length ? `<div class="comp-dots">
              ${secondary.map(id=>`<span class="comp-dot" style="--dot-color:${COMPONENTS[id].color}" title="${COMPONENTS[id].label}" data-on="${c.entry && COMPONENTS[id].dayDone(c.entry) ? '1':'0'}"></span>`).join('')}
            </div>` : ''}
            <div class="heat-steps">${metric || '&middot;'}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderRun(today){
  const info = appData.users.map(u=>currentRun(u, today));
  return `
    <div class="card">
      <div class="score-head">
        <h3>Goal streak</h3>
        <span class="week-label">4+ days on your main habit, back-to-back weeks</span>
      </div>
      <div class="run-row">
        ${appData.users.map((u,i)=>`
          <div class="run-item">
            <div class="run-num" style="color:${playerTheme(i).color}">${info[i].hasData ? info[i].run : '&ndash;'}</div>
            <div class="run-label">${info[i].hasData ? `${u}'s streak` : `${u} \u2014 no data yet`}</div>
          </div>
          ${i<appData.users.length-1?'<div class="run-div"></div>':''}
        `).join('')}
      </div>
    </div>`;
}

    root.innerHTML = `
      <h1 class="wordmark">STREAK</h1>

        <h2>One step left</h2>
        <p>Add your Supabase project URL and anon key near the top of index.html, then reload. See README.md for the 2-minute setup.</p>
      </div>`;
    return;
  }
  appData = await loadData();
  if(!appData){ renderSetup(); return; }
  if(migrateUserComponents()) await saveData();
  renderApp();
})();
